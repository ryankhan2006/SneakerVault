<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SneakerBot - Your Sneaker Shopping Assistant</title>
  <style>
    /* ===== GLOBAL STYLES ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* ===== CHAT CONTAINER ===== */
    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 90vh;
      max-height: 800px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      border-radius: 16px 16px 0 0;
    }

    .chat-header span {
      font-size: 28px;
      margin-right: 8px;
    }

    /* ===== MESSAGES AREA ===== */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Custom scrollbar */
    .messages-container::-webkit-scrollbar {
      width: 8px;
    }

    .messages-container::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    .messages-container::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 4px;
    }

    .messages-container::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    /* ===== MESSAGE BUBBLES ===== */
    .message {
      display: flex;
      margin-bottom: 8px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.bot {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      word-wrap: break-word;
      line-height: 1.4;
    }

    .message.user .message-bubble {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.bot .message-bubble {
      background: white;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* ===== PRODUCT CARDS ===== */
    .product-cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .product-card {
      background: white;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      gap: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    .product-image {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      background: #f0f0f0;
    }

    .product-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .product-name {
      font-weight: 600;
      font-size: 14px;
      color: #333;
      margin-bottom: 4px;
    }

    .product-brand {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 16px;
      font-weight: 700;
      color: #667eea;
    }

    /* ===== INPUT AREA ===== */
    .input-container {
      padding: 16px 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .input-box {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-box:focus {
      border-color: #667eea;
    }

    .send-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .send-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .send-button:active {
      transform: translateY(0);
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== WELCOME MESSAGE ===== */
    .welcome-message {
      text-align: center;
      color: #666;
      padding: 40px 20px;
      font-size: 14px;
      line-height: 1.6;
    }

    .welcome-message h2 {
      color: #333;
      margin-bottom: 12px;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <!-- ===== CHAT CONTAINER ===== -->
  <div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
      <span>👟</span> SneakerBot
    </div>

    <!-- Messages Area -->
    <div class="messages-container" id="messages">
      <div class="welcome-message">
        <h2>Welcome to SneakerBot!</h2>
        <p>I can help you find the perfect sneakers. Try asking me about:</p>
        <p><strong>Brands:</strong> Jordan, Nike, Adidas, Puma, New Balance</p>
        <p><strong>Colors:</strong> black, white, red, blue, green</p>
        <p><strong>Price:</strong> "under $200" or "under $150"</p>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-container">
      <input
        type="text"
        class="input-box"
        id="userInput"
        placeholder="Ask me about sneakers..."
        autocomplete="off"
      >
      <button class="send-button" id="sendButton">Send</button>
    </div>
  </div>

  <script>
    // ===== MOCK SNEAKER DATASET =====
    const sneakers = [
      {
        name: "Air Jordan 1 Retro High",
        brand: "Jordan",
        color: "red",
        price: 170,
        image: "https://images.unsplash.com/photo-1556906781-9a412961c28c?w=400&h=400&fit=crop"
      },
      {
        name: "Nike Air Max 90",
        brand: "Nike",
        color: "white",
        price: 130,
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=400&fit=crop"
      },
      {
        name: "Adidas Ultraboost",
        brand: "Adidas",
        color: "black",
        price: 180,
        image: "https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=400&h=400&fit=crop"
      },
      {
        name: "Nike Dunk Low",
        brand: "Nike",
        color: "blue",
        price: 110,
        image: "https://images.unsplash.com/photo-1600185365926-3a2ce3cdb9eb?w=400&h=400&fit=crop"
      },
      {
        name: "Adidas Stan Smith",
        brand: "Adidas",
        color: "white",
        price: 85,
        image: "https://images.unsplash.com/photo-1543508282-6319a3e2621f?w=400&h=400&fit=crop"
      },
      {
        name: "Puma Suede Classic",
        brand: "Puma",
        color: "black",
        price: 75,
        image: "https://images.unsplash.com/photo-1552346154-21d32810aba3?w=400&h=400&fit=crop"
      },
      {
        name: "New Balance 574",
        brand: "New Balance",
        color: "grey",
        price: 90,
        image: "https://images.unsplash.com/photo-1539185441755-769473a23570?w=400&h=400&fit=crop"
      }
    ];

    // ===== DOM ELEMENTS =====
    const messagesContainer = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');

    // ===== ADD MESSAGE TO CHAT =====
    function addMessage(text, isUser = false, products = null) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = 'message-bubble';
      bubbleDiv.textContent = text;

      messageDiv.appendChild(bubbleDiv);
      messagesContainer.appendChild(messageDiv);

      // If there are products to display, add product cards
      if (products && products.length > 0) {
        const productCardsDiv = document.createElement('div');
        productCardsDiv.className = 'product-cards';

        products.forEach(product => {
          const cardDiv = document.createElement('div');
          cardDiv.className = 'product-card';

          cardDiv.innerHTML = `
            <img src="${product.image}" alt="${product.name}" class="product-image">
            <div class="product-info">
              <div class="product-name">${product.name}</div>
              <div class="product-brand">${product.brand}</div>
              <div class="product-price">$${product.price}</div>
            </div>
          `;

          productCardsDiv.appendChild(cardDiv);
        });

        messagesContainer.appendChild(productCardsDiv);
      }

      // Scroll to bottom
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // ===== PARSE USER MESSAGE =====
    function parseMessage(message) {
      const lowerMessage = message.toLowerCase();

      // Initialize filters
      let filters = {
        brand: null,
        color: null,
        maxPrice: null
      };

      // Detect brand (Jordan, Nike, Adidas, Puma, New Balance)
      if (/jordan/i.test(lowerMessage)) {
        filters.brand = 'Jordan';
      } else if (/nike/i.test(lowerMessage)) {
        filters.brand = 'Nike';
      } else if (/adidas/i.test(lowerMessage)) {
        filters.brand = 'Adidas';
      } else if (/puma/i.test(lowerMessage)) {
        filters.brand = 'Puma';
      } else if (/new balance/i.test(lowerMessage)) {
        filters.brand = 'New Balance';
      }

      // Detect color (black, white, red, blue, green, grey)
      if (/black/i.test(lowerMessage)) {
        filters.color = 'black';
      } else if (/white/i.test(lowerMessage)) {
        filters.color = 'white';
      } else if (/red/i.test(lowerMessage)) {
        filters.color = 'red';
      } else if (/blue/i.test(lowerMessage)) {
        filters.color = 'blue';
      } else if (/green/i.test(lowerMessage)) {
        filters.color = 'green';
      } else if (/grey|gray/i.test(lowerMessage)) {
        filters.color = 'grey';
      }

      // Detect price filter (under $X or under X or less than X)
      const priceMatch = lowerMessage.match(/(?:under|less than|below)\s*\$?(\d+)/i);
      if (priceMatch) {
        filters.maxPrice = parseInt(priceMatch[1]);
      }

      return filters;
    }

    // ===== FILTER SNEAKERS =====
    function filterSneakers(filters) {
      let results = sneakers;

      // Apply brand filter
      if (filters.brand) {
        results = results.filter(s => s.brand === filters.brand);
      }

      // Apply color filter
      if (filters.color) {
        results = results.filter(s => s.color === filters.color);
      }

      // Apply price filter
      if (filters.maxPrice) {
        results = results.filter(s => s.price <= filters.maxPrice);
      }

      return results;
    }

    // ===== PLACEHOLDER LLM FUNCTION =====
    function askLLM(message) {
      // This is a mock function that simulates a smart reply
      const responses = [
        "I'm here to help you find sneakers! Try asking about specific brands like Nike, Jordan, or Adidas.",
        "Looking for something specific? I can help you filter by brand, color, or price range!",
        "You can ask me things like 'Show me Nike sneakers under $150' or 'Find black Adidas shoes'.",
        "I'd love to help! Try being more specific - mention a brand, color, or price range.",
        "Great question! I specialize in sneaker searches. Ask me about brands, colors, or your budget!",
      ];

      // Return a random response
      return responses[Math.floor(Math.random() * responses.length)];
    }

    // ===== HANDLE USER INPUT =====
    function handleUserMessage() {
      const message = userInput.value.trim();

      if (!message) return;

      // Add user message to chat
      addMessage(message, true);

      // Clear input
      userInput.value = '';

      // Parse the message
      const filters = parseMessage(message);

      // Check if any filters were detected
      const hasFilters = filters.brand || filters.color || filters.maxPrice;

      setTimeout(() => {
        if (hasFilters) {
          // Filter sneakers based on criteria
          const results = filterSneakers(filters);

          if (results.length > 0) {
            let responseText = `I found ${results.length} sneaker${results.length > 1 ? 's' : ''} matching your criteria`;

            // Build filter description
            let filterDesc = [];
            if (filters.brand) filterDesc.push(filters.brand);
            if (filters.color) filterDesc.push(filters.color);
            if (filters.maxPrice) filterDesc.push(`under $${filters.maxPrice}`);

            if (filterDesc.length > 0) {
              responseText += ` (${filterDesc.join(', ')})`;
            }
            responseText += ':';

            addMessage(responseText, false, results);
          } else {
            addMessage("Sorry, I couldn't find any sneakers matching those criteria. Try adjusting your filters!", false);
          }
        } else {
          // No filters detected, use LLM placeholder
          const llmResponse = askLLM(message);
          addMessage(llmResponse, false);
        }
      }, 500);
    }

    // ===== EVENT LISTENERS =====
    sendButton.addEventListener('click', handleUserMessage);

    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleUserMessage();
      }
    });

    // Focus input on load
    userInput.focus();
  </script>
</body>
</html>
